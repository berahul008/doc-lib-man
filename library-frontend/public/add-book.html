<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Book</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; margin: 0; }
        .card { max-width: 420px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 8px; }
        button:hover { background-color: #0056b3; }
        .nav-links { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        .nav-links a { text-decoration: none; color: #007bff; }
        .nav-links a:hover { text-decoration: underline; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="nav-links">
            <a href="/dashboard">⬅ Back to Dashboard</a>
            <a href="/catalog">📚 View Catalog</a>
        </div>

        <h2>Add New Book</h2>
        <form id="add-book-form">
            <label for="title">Book Title:</label>
            <input type="text" id="title" name="title" placeholder="e.g., Kubernetes in Action" required>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author" placeholder="e.g., Marko Luksa" required>

            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn" placeholder="e.g., 978-1617293726" required>

            <label for="copies">Total Copies:</label>
            <input type="number" id="copies" name="copies" min="1" value="1" required>

            <button type="submit">Add Book</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const API_BASE = "/api";

        document.getElementById('add-book-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new URLSearchParams(new FormData(this));
            const msgEl = document.getElementById('message');

            try {
                const response = await fetch(`${API_BASE}/books`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();
                msgEl.innerText = result;
                msgEl.style.color = result.toLowerCase().includes("successfully") ? "green" : "red";

                if (result.toLowerCase().includes("successfully")) {
                    this.reset();
                }
            } catch (err) {
                msgEl.innerText = 'Failed to connect to backend server.';
                msgEl.style.color = 'red';
            }
        });
    </script>
</body>
</html>
