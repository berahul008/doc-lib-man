<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        p { text-align: center; font-size: 14px; }
        #error-msg { color: red; text-align: center; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Library Login</h2>
        <form id="login-form">
            <input type="hidden" name="action" value="login">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Login</button>
        </form>
        <div id="error-msg"></div>
        <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>

    <script>
        const API_BASE = "/api";

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new URLSearchParams(new FormData(this));

            try {
                const response = await fetch(`${API_BASE}/auth`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();
                
                if (result.includes("Login successful")) {
                    // Example result format: Login successful|ID:2|rahul|CUSTOMER
                    const parts = result.split('|');
                    const userId = parts[1] ? parts[1].split(':')[1] : '1';
                    const username = parts[2] || document.getElementById('username').value;
                    const role = parts[3] || 'CUSTOMER';
                    
                    localStorage.setItem('userId', userId);
                    localStorage.setItem('username', username);
                    localStorage.setItem('userRole', role);

                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('error-msg').innerText = result;
                }

            } catch (err) {
                document.getElementById('error-msg').innerText = 'Server connection failed.';
            }
        });
    </script>

</body>
</html>
